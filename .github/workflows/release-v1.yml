name: v1.0.0 Sürümünü Yayımla

on:
  workflow_dispatch:
  push:
    paths:
      - "release/READY"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python ortamını kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılık ve test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          python -m pytest -q
          python -m compileall -q app

      - name: Repo açıklaması ve konu etiketleri
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}" \
            -f description='Marka bağımsız, mobil öncelikli Modbus enerji izleme ve SCADA platformu.' \
            -f homepage='https://batuhanayribas.com'
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/topics" \
            -f 'names[]=scada' -f 'names[]=modbus' -f 'names[]=energy-monitoring' \
            -f 'names[]=industrial-iot' -f 'names[]=fastapi' -f 'names[]=rs485' \
            -f 'names[]=power-quality' -f 'names[]=prometheus' -f 'names[]=docker' \
            -f 'names[]=turkce'

      - name: Geçici tetikleyiciyi temizle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f release/READY ]; then
            git rm -f release/READY
            git commit -m "chore: v1.0.0 sürüm tetikleyicisini temizle"
            git push origin HEAD:main
          fi

      - name: Etiketleri oluştur
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          git tag -fa v1.0.0 -m "Rootcastle Energy SCADA v1.0.0"
          git tag -fa v1 -m "Rootcastle Energy SCADA v1 kararlı seri"
          git push origin refs/tags/v1.0.0 --force
          git push origin refs/tags/v1 --force

      - name: Kaynak paketini oluştur
        run: |
          git archive --format=zip --output=/tmp/rootcastle-energy-scada-v1.0.0.zip HEAD
          sha256sum /tmp/rootcastle-energy-scada-v1.0.0.zip

      - name: Türkçe GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/notlar.md <<'NOTES'
          ## Rootcastle Energy SCADA v1.0.0

          İlk kararlı public sürüm.

          ### Öne çıkanlar
          - Marka bağımsız JSON cihaz profili altyapısı
          - Doğrulanmış ENTES MPR-53S profili
          - Modbus RTU, TCP-RTU ve Modbus TCP mimarisi
          - Türkçe ve kapsamlı README
          - Rootcastle ve batuhanayribas.com markalaması
          - Mobil uyumlu SCADA arayüzü
          - Docker, FastAPI, WebSocket ve Prometheus altyapısı
          - Otomatik testler ve güvenli salt-okunur yaklaşım
          NOTES
          gh release delete v1.0.0 --yes >/dev/null 2>&1 || true
          gh release create v1.0.0 /tmp/rootcastle-energy-scada-v1.0.0.zip \
            --title "Rootcastle Energy SCADA v1.0.0" \
            --notes-file /tmp/notlar.md \
            --latest
